<div class="container" style="max-width: 650px;">
  <div class="card">
    <div class="card-header">
      <span class="card-title">Create Internal Job Posting</span>
      <a routerLink="/admin-dashboard" class="btn btn-secondary btn-sm">Cancel</a>
    </div>

    <div *ngIf="errorMessage" class="badge badge-rejected" style="width: 100%; padding: 8px; margin-bottom: 16px; text-transform: none;">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="form-group">
          <label>Job Code / Reference ID</label>
          <input type="text" class="form-control" placeholder="Auto-generated if empty (e.g. JOB-104)" [(ngModel)]="job.jobId" name="jobId">
        </div>

        <div class="form-group">
          <label>Designation Master *</label>
          <select class="form-control" [(ngModel)]="job.designation" name="designation" required>
            <option value="">-- Select Designation --</option>
            <option *ngFor="let d of activeDesignations" [value]="d.name">{{ d.name }}</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Posting Title</label>
        <input type="text" class="form-control" placeholder="e.g. Senior Java Microservices Engineer" [(ngModel)]="job.title" name="title">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="form-group">
          <label>Department</label>
          <input type="text" class="form-control" placeholder="e.g. Engineering, UX Design" [(ngModel)]="job.department" name="dept">
        </div>

        <div class="form-group">
          <label>Work Location *</label>
          <input type="text" class="form-control" placeholder="e.g. Bangalore, Remote, Noida" [(ngModel)]="job.location" name="location" required>
        </div>
      </div>

      <div class="form-group">
        <label>Job Description *</label>
        <textarea class="form-control" rows="4" placeholder="Detail the key responsibilities and role requirements..." [(ngModel)]="job.description" name="desc" required></textarea>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="form-group">
          <label>Required Skill Set *</label>
          <input type="text" class="form-control" placeholder="e.g. Java, Spring Boot, Microservices" [(ngModel)]="job.skillSet" name="skills" required>
        </div>

        <div class="form-group">
          <label>Experience Required *</label>
          <input type="text" class="form-control" placeholder="e.g. 3-5 years" [(ngModel)]="job.experience" name="exp" required>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
        <div class="form-group">
          <label>Salary Min (Annual ₹)</label>
          <input type="number" class="form-control" [(ngModel)]="job.salaryMin" name="salMin">
        </div>
        <div class="form-group">
          <label>Salary Max (Annual ₹)</label>
          <input type="number" class="form-control" [(ngModel)]="job.salaryMax" name="salMax">
        </div>
        <div class="form-group">
          <label>Lifecycle Status *</label>
          <select class="form-control" [(ngModel)]="job.status" name="status">
            <option value="PUBLISHED">PUBLISHED</option>
            <option value="DRAFT">DRAFT</option>
            <option value="PAUSED">PAUSED</option>
            <option value="CLOSED">CLOSED</option>
          </select>
        </div>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px;">
        <a routerLink="/admin-dashboard" class="btn btn-secondary btn-sm">Cancel</a>
        <button type="submit" class="btn btn-primary btn-sm" [disabled]="isSubmitting">
          <span *ngIf="isSubmitting">Saving Job Posting...</span>
          <span *ngIf="!isSubmitting">Create Job Posting</span>
        </button>
      </div>
    </form>
  </div>
</div>
